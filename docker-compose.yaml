services:

  env-postgres:
    image: postgres:18.1-bookworm
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/pgdata:/var/lib/postgresql
    restart: always

  port-forward:
    image: alpine/socat:1.8.0.3
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:env-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    restart: always